name: Project Board Automation

# Keeps the GitHub Project tab in sync with repo activity so that
# transactions, handoffs, and progress are always transparent.

on:
  issues:
    types: [opened, labeled, assigned, closed, reopened]
  pull_request:
    types: [opened, ready_for_review, review_requested, closed, reopened, labeled]
  pull_request_review:
    types: [submitted]

env:
  # Set PROJECT_NUMBER to match the GitHub Project board for this repo.
  # The workflow reads this at runtime so it works for forks too.
  PROJECT_NUMBER: 1

jobs:
  # ── 1. Auto-add every new issue / PR to the project board ──────────
  add-to-project:
    name: Add to project board
    if: >
      github.event_name == 'issues' && github.event.action == 'opened' ||
      github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Resolve project URL
        id: project-url
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUM: ${{ env.PROJECT_NUMBER }}
        run: |
          # Try org-owned project first, fall back to user-owned
          ORG_ID=$(gh api graphql -f query='
            query($owner: String!, $num: Int!) {
              organization(login: $owner) {
                projectV2(number: $num) { id }
              }
            }' -f owner="$OWNER" -F num="$PROJECT_NUM" \
            --jq '.data.organization.projectV2.id' 2>/dev/null || echo "")

          if [ -n "$ORG_ID" ]; then
            echo "url=https://github.com/orgs/${OWNER}/projects/${PROJECT_NUM}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://github.com/users/${OWNER}/projects/${PROJECT_NUM}" >> "$GITHUB_OUTPUT"
          fi

      - name: Add item to project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ steps.project-url.outputs.url }}
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

  # ── 2. Auto-label issues / PRs by hypothesis based on paths/title ──
  auto-label:
    name: Auto-label by hypothesis
    if: >
      github.event_name == 'issues' && github.event.action == 'opened' ||
      github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label issues by title keywords
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          TEXT="$ISSUE_TITLE $ISSUE_BODY"
          LABELS=""

          if echo "$TEXT" | grep -iqE 'memory|flywheel|h1|lesson'; then
            LABELS="$LABELS,H1-memory"
          fi
          if echo "$TEXT" | grep -iqE 'mcp|swarm|monolith|h2'; then
            LABELS="$LABELS,H2-swarm"
          fi
          if echo "$TEXT" | grep -iqE 'space|density|context|h3'; then
            LABELS="$LABELS,H3-spaces"
          fi

          LABELS="${LABELS#,}"
          if [ -n "$LABELS" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "$LABELS" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          fi

      - name: Label PRs by changed paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILES=$(gh pr diff "$PR_NUMBER" --name-only -R "$GITHUB_REPOSITORY" 2>/dev/null || true)
          LABELS=""

          if echo "$FILES" | grep -q 'h1-memory-flywheel/'; then
            LABELS="$LABELS,H1-memory"
          fi
          if echo "$FILES" | grep -q 'h2-mcp-swarm/'; then
            LABELS="$LABELS,H2-swarm"
          fi
          if echo "$FILES" | grep -q 'h3-spaces-density/'; then
            LABELS="$LABELS,H3-spaces"
          fi

          LABELS="${LABELS#,}"
          if [ -n "$LABELS" ]; then
            gh pr edit "$PR_NUMBER" --add-label "$LABELS" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          fi

  # ── 3. Move project cards on status-change events ──────────────────
  #    Maps repo lifecycle events → Project board Status field so the
  #    board always reflects current state without manual drag-and-drop.
  update-project-status:
    name: Sync status to project board
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Determine target status
        id: status
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          REVIEW_STATE: ${{ github.event.review.state }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          STATUS=""

          # ── Issue events ────────────────────────────────────────
          if [ "$EVENT" = "issues" ]; then
            case "$ACTION" in
              opened)    STATUS="Triage"       ;;
              assigned)  STATUS="In Progress"  ;;
              closed)    STATUS="Done"         ;;
              reopened)  STATUS="In Progress"  ;;
            esac
          fi

          # ── Pull-request events ─────────────────────────────────
          if [ "$EVENT" = "pull_request" ]; then
            case "$ACTION" in
              opened)
                if [ "$DRAFT" = "true" ]; then
                  STATUS="In Progress"
                else
                  STATUS="In Review"
                fi
                ;;
              ready_for_review)    STATUS="In Review"   ;;
              review_requested)    STATUS="In Review"   ;;
              closed)
                if [ "$MERGED" = "true" ]; then
                  STATUS="Done"
                else
                  STATUS="Triage"
                fi
                ;;
              reopened)            STATUS="In Review"   ;;
            esac
          fi

          # ── Review events ───────────────────────────────────────
          if [ "$EVENT" = "pull_request_review" ]; then
            case "$REVIEW_STATE" in
              approved)           STATUS="Done"        ;;
              changes_requested)  STATUS="In Progress" ;;
            esac
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Resolved status: $STATUS"

      - name: Move card on project board
        if: steps.status.outputs.status != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_STATUS: ${{ steps.status.outputs.status }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUM: ${{ env.PROJECT_NUMBER }}
        run: |
          # Resolve project ID
          PROJECT_ID=$(gh api graphql -f query='
            query($owner: String!, $num: Int!) {
              organization(login: $owner) {
                projectV2(number: $num) { id }
              }
            }' -f owner="$OWNER" -F num="$PROJECT_NUM" \
            --jq '.data.organization.projectV2.id' 2>/dev/null || echo "")

          # Fall back to user-owned project if org lookup fails
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID=$(gh api graphql -f query='
              query($owner: String!, $num: Int!) {
                user(login: $owner) {
                  projectV2(number: $num) { id }
                }
              }' -f owner="$OWNER" -F num="$PROJECT_NUM" \
              --jq '.data.user.projectV2.id' 2>/dev/null || echo "")
          fi

          if [ -z "$PROJECT_ID" ]; then
            echo "::warning::Could not resolve project board — skipping status update"
            exit 0
          fi

          # Find the Status field and its option IDs
          FIELD_DATA=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" 2>/dev/null || echo "")

          STATUS_FIELD_ID=$(echo "$FIELD_DATA" | jq -r '
            .data.node.fields.nodes[]
            | select(.name == "Status")
            | .id' 2>/dev/null || echo "")

          OPTION_ID=$(echo "$FIELD_DATA" | jq -r --arg status "$TARGET_STATUS" '
            .data.node.fields.nodes[]
            | select(.name == "Status")
            | .options[]
            | select(.name == $status)
            | .id' 2>/dev/null || echo "")

          if [ -z "$STATUS_FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "::warning::Status field or option '$TARGET_STATUS' not found on project — skipping"
            exit 0
          fi

          # Find the item on the project board
          CONTENT_ID=""
          if [ "$EVENT" = "issues" ]; then
            CONTENT_ID="${{ github.event.issue.node_id }}"
          else
            CONTENT_ID="${{ github.event.pull_request.node_id }}"
          fi

          ITEM_ID=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue { id }
                        ... on PullRequest { id }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" \
            --jq ".data.node.items.nodes[] | select(.content.id == \"$CONTENT_ID\") | .id" 2>/dev/null || echo "")

          if [ -z "$ITEM_ID" ]; then
            echo "::notice::Item not yet on project board — it will be added by the add-to-project job"
            exit 0
          fi

          # Update the Status field
          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) {
                projectV2Item { id }
              }
            }' -f projectId="$PROJECT_ID" \
               -f itemId="$ITEM_ID" \
               -f fieldId="$STATUS_FIELD_ID" \
               -f optionId="$OPTION_ID"

          echo "Moved item to '$TARGET_STATUS'"

  # ── 4. Post handoff comment on review-related transitions ──────────
  handoff-comment:
    name: Post handoff transparency comment
    if: >
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'pull_request' && contains(fromJSON('["review_requested","ready_for_review","closed"]'), github.event.action))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post transition comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          REVIEW_STATE: ${{ github.event.review.state }}
          ACTOR: ${{ github.actor }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
        run: |
          COMMENT=""

          if [ "$EVENT" = "pull_request" ]; then
            case "$ACTION" in
              review_requested)
                COMMENT="**Handoff →** @${ACTOR} requested review from @${REVIEWER:-a team member}."
                ;;
              ready_for_review)
                COMMENT="**Handoff →** @${ACTOR} marked this PR as ready for review."
                ;;
              closed)
                if [ "$MERGED" = "true" ]; then
                  COMMENT="**Handoff ✓** PR merged by @${ACTOR}. Changes are now on the target branch."
                fi
                ;;
            esac
          fi

          if [ "$EVENT" = "pull_request_review" ]; then
            case "$REVIEW_STATE" in
              approved)
                COMMENT="**Handoff ✓** @${ACTOR} approved this PR."
                ;;
              changes_requested)
                COMMENT="**Handoff ←** @${ACTOR} requested changes. Returning to author for revision."
                ;;
            esac
          fi

          if [ -n "$COMMENT" ]; then
            gh pr comment "$PR_NUMBER" --body "$COMMENT" -R "$GITHUB_REPOSITORY"
          fi
