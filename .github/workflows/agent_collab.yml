name: Agent Collaboration

# Orchestrates the Claude + Jules managed agent system.
# Claude (via Copilot) handles code reviews and technical analysis.
# Jules handles async coding tasks tagged with #Jules.
# This workflow provides the coordination layer.

on:
  schedule:
    # Run daily to check for pending agent tasks
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      task:
        description: "Agent task to run (analyse|report|optimise)"
        required: true
        default: "analyse"
        type: choice
        options:
          - analyse
          - report
          - optimise

permissions:
  contents: read

jobs:
  analyse:
    name: Run hypothesis analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.inputs.task == 'analyse' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run quick start example
        run: python examples/quick_start.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

  report:
    name: Generate status report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.inputs.task == 'report'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate bandit statistics report
        run: |
          python - <<'EOF'
          from hypothesis_lab.bandit import EpsilonGreedyBandit, ThompsonSamplingBandit
          import json

          eg = EpsilonGreedyBandit(["gravity", "anti_gravity", "balanced"], seed=42)
          ts = ThompsonSamplingBandit(["gravity", "anti_gravity", "balanced"], seed=42)

          # Simulate 50 rounds
          import random
          rng = random.Random(42)
          for _ in range(50):
              arm = eg.select()
              reward = rng.random()
              eg.update(arm, reward)

              arm = ts.select()
              reward = rng.random()
              ts.update(arm, reward)

          print("=== Epsilon-Greedy Summary ===")
          print(json.dumps(eg.summary(), indent=2))
          print("\n=== Thompson Sampling Summary ===")
          print(json.dumps(ts.summary(), indent=2))
          EOF
