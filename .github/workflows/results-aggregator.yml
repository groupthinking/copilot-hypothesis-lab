name: Results Aggregator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute Results & Markdown
        run: |
          python3 -c "
          import os, json
          from src.hypothesis_lab.aggregate import calculate_stats, update_results_md
          os.makedirs('metrics/raw', exist_ok=True)
          stats = calculate_stats()
          with open('metrics/raw/latest.json', 'w') as f:
            json.dump(stats, f, indent=2)
          update_results_md(stats)
          "

      - name: Publish Step Summary
        run: |
          echo "### Nightly Aggregation Report" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat metrics/raw/latest.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check Stagnation (Alert if no PRs in 72 hours)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 src/hypothesis_lab/alerts.py

      - name: Commit Dashboard (If Metrics Changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only stage latest.json and RESULTS.md
          git add metrics/raw/latest.json RESULTS.md
          # Exclude timestamp-only diffs by checking if numbers/status changed
          if ! git diff --staged --quiet metrics/raw/latest.json; then
            git commit -m "chore: update benchmark results [skip ci]"
            git push
          else
            echo "No metric updates detected. Skipping commit to avoid git churn."
          fi
