name: Project Flow Automation

on:
  issues:
    types: [opened, reopened, assigned, closed]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

jobs:
  sync-project-flow:
    name: Sync issue/PR flow to Project tab
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      repository-projects: write

    steps:
      - name: Project flow automation
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_V2_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const ownerLogin = process.env.PROJECT_OWNER || context.repo.owner;
            const projectNumberRaw = process.env.PROJECT_NUMBER;
            const projectNumber = Number(projectNumberRaw);

            if (!projectNumberRaw || Number.isNaN(projectNumber)) {
              core.notice("PROJECT_NUMBER repository variable is not configured; skipping project sync.");
              return;
            }

            const getProject = async () => {
              const query = `
                query($owner: String!, $number: Int!) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      id
                      title
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                  user(login: $owner) {
                    projectV2(number: $number) {
                      id
                      title
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, {
                owner: ownerLogin,
                number: projectNumber,
              });

              return result.organization?.projectV2 || result.user?.projectV2;
            };

            const project = await getProject();
            if (!project) {
              core.notice(`Project #${projectNumber} not found for owner ${ownerLogin}; skipping.`);
              return;
            }

            const statusField = project.fields.nodes.find((field) => field?.name?.toLowerCase() === "status");
            if (!statusField) {
              core.notice("Status field not found in project; skipping.");
              return;
            }

            const contentNodeId = context.payload.issue?.node_id || context.payload.pull_request?.node_id;
            if (!contentNodeId) {
              core.notice("No issue or pull request node id found; skipping.");
              return;
            }

            let itemId;
            try {
              const addItem = await github.graphql(
                `
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                      item {
                        id
                      }
                    }
                  }
                `,
                { projectId: project.id, contentId: contentNodeId }
              );
              itemId = addItem.addProjectV2ItemById.item.id;
            } catch (error) {
              const existingItemResult = await github.graphql(
                `
                  query($contentId: ID!) {
                    node(id: $contentId) {
                      ... on Issue {
                        projectItems(first: 50) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                      ... on PullRequest {
                        projectItems(first: 50) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                `,
                { contentId: contentNodeId }
              );

              const nodes = existingItemResult.node?.projectItems?.nodes || [];
              const existingItem = nodes.find((node) => node?.project?.id === project.id);
              if (!existingItem) {
                throw error;
              }
              itemId = existingItem.id;
            }

            const event = context.eventName;
            const action = context.payload.action;
            const isMerged = Boolean(context.payload.pull_request?.merged);

            let preferredStatuses = ["Todo", "To Do", "Backlog"];
            if (event === "issues") {
              if (action === "assigned") preferredStatuses = ["In Progress", "Todo", "To Do"];
              if (action === "closed") preferredStatuses = ["Done"];
              if (action === "opened" || action === "reopened") preferredStatuses = ["Todo", "To Do", "Backlog"];
            } else if (event === "pull_request") {
              if (action === "closed" && isMerged) preferredStatuses = ["Done"];
              else if (action === "closed") preferredStatuses = ["Todo", "To Do", "In Progress"];
              else if (action === "converted_to_draft") preferredStatuses = ["In Progress", "Todo", "To Do"];
              else preferredStatuses = ["In Review", "Review", "In Progress", "Todo", "To Do"];
            }

            const selectedStatus = preferredStatuses
              .map((name) => statusField.options.find((option) => option.name.toLowerCase() === name.toLowerCase()))
              .find(Boolean);

            if (!selectedStatus) {
              core.notice(`No matching status option found for: ${preferredStatuses.join(", ")}.`);
              return;
            }

            await github.graphql(
              `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `,
              {
                projectId: project.id,
                itemId,
                fieldId: statusField.id,
                optionId: selectedStatus.id,
              }
            );

            if (event === "pull_request") {
              const pr = context.payload.pull_request;
              const matchRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
              const linkedIssues = [...(pr?.body || "").matchAll(matchRegex)].map((m) => Number(m[1]));
              if (linkedIssues.length > 0) {
                const stateText =
                  action === "closed"
                    ? isMerged
                      ? "completed"
                      : "returned to backlog"
                    : "in handoff";
                for (const issueNumber of [...new Set(linkedIssues)]) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: `<!-- project-flow-automation -->\n🔄 Project flow update: PR #${pr.number} is now **${stateText}** via \`${action}\`.`,
                  });
                }
              }
            }

            core.notice(`Project flow synced: set status to "${selectedStatus.name}" for item ${itemId}.`);
        env:
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
